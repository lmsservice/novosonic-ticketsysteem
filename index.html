<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVOSONIC Support Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1117; --surface:#141A21; --surface-hover:#1B222B; --border:#242C36; --border-light:#2E3844;
    --text:#E6EDF3; --text2:#7D8A97; --text3:#4B5563;
    --accent:#00E5C7; --accent-dim:rgba(0,229,199,0.12);
    --high:#FF5D5D; --high-dim:rgba(255,93,93,0.12);
    --medium:#FFB454; --medium-dim:rgba(255,180,84,0.12);
    --low:#4C8DFF; --low-dim:rgba(76,141,255,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  @keyframes pingdot{0%{transform:scale(1);opacity:.5;}75%,100%{transform:scale(2.4);opacity:0;}}
  @keyframes scanline{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

  #app{display:flex;height:100vh;overflow:hidden;}

  .rail{width:232px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
  .rail-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#0A8C7A);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#04211D;}
  .brand-name{font-weight:600;font-size:15px;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:var(--text3);margin-top:2px;margin-left:34px;letter-spacing:.5px;}
  .new-ticket-btn{margin:16px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#04211D;border:none;border-radius:8px;padding:9px 12px;font-weight:600;font-size:13px;width:calc(100% - 32px);}
  .nav{padding:0 12px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:none;border-radius:7px;padding:8px 10px;color:var(--text2);font-size:13.5px;font-weight:500;}
  .nav-item.active{background:var(--surface-hover);color:var(--text);font-weight:600;}
  .nav-item-label{display:flex;align-items:center;gap:8px;}
  .nav-item-count{font-size:11.5px;color:var(--text3);}
  .rail-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:8px;}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--surface-hover);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2);}

  .dot{position:relative;display:inline-flex;width:7px;height:7px;flex-shrink:0;}
  .dot-ping{position:absolute;inset:0;border-radius:50%;}
  .dot-ping.pulse{animation:pingdot 2s cubic-bezier(0,0,0.2,1) infinite;opacity:.5;}
  .dot-core{position:relative;width:7px;height:7px;border-radius:50%;}

  .list-col{width:360px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
  .list-search{padding:14px;border-bottom:1px solid var(--border);}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute;left:10px;top:10px;}
  #searchInput{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 10px 8px 30px;color:var(--text);font-size:13px;outline:none;}
  .list-scroll{overflow-y:auto;flex:1;}
  .ticket-row{display:block;width:100%;text-align:left;padding:12px 16px;background:transparent;border:none;border-left:2px solid transparent;border-bottom:1px solid var(--border);}
  .ticket-row.selected{background:var(--surface-hover);border-left:2px solid var(--accent);}
  .ticket-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .ticket-id{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;}
  .ticket-time{font-size:10.5px;color:var(--text3);}
  .ticket-subject{font-size:13.5px;font-weight:600;margin-bottom:4px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ticket-row-bottom{display:flex;align-items:center;justify-content:space-between;}
  .ticket-company{font-size:12px;color:var(--text2);}
  .badge{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px;}
  .empty-note{padding:24px;color:var(--text3);font-size:13px;text-align:center;}

  .dashboard-wrap{flex:1;overflow-y:auto;padding:26px 30px;}
  .dashboard-title{font-size:20px;font-weight:600;}
  .dashboard-sub{font-size:13px;color:var(--text2);margin-top:4px;}
  .stats-row{display:flex;gap:14px;margin:22px 0 26px;}
  .stat-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .stat-value{font-size:26px;font-weight:700;}
  .stat-label{font-size:12px;color:var(--text2);margin-top:4px;display:flex;align-items:center;gap:6px;}
  .kanban{display:flex;gap:16px;align-items:flex-start;}
  .kanban-col{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;max-height:calc(100vh - 260px);}
  .kanban-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .kanban-col-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;}
  .kanban-col-count{font-size:12px;color:var(--text3);}
  .kanban-cards{display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
  .kanban-card{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .kanban-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .kanban-card-id{font-size:10px;color:var(--text3);}
  .kanban-card-subject{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
  .kanban-card-bottom{display:flex;justify-content:space-between;align-items:center;}
  .kanban-card-company{font-size:11.5px;color:var(--text2);}
  .kanban-empty{color:var(--text3);font-size:12px;padding:8px 2px;}

  .detail-col{flex:1;display:flex;flex-direction:column;min-width:0;}
  .detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;}
  .scanline{position:relative;height:2px;background:linear-gradient(90deg,transparent,rgba(0,229,199,.33),transparent);background-size:50% 100%;animation:scanline 4s linear infinite;}
  .detail-header{padding:18px 24px;border-bottom:1px solid var(--border);}
  .detail-header-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .detail-id{font-size:12px;color:var(--text3);margin-bottom:4px;}
  .detail-subject{font-size:18px;font-weight:600;}
  .status-buttons{display:flex;gap:8px;}
  .status-btn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--text3);}
  .status-btn.active{background:var(--surface-hover);border:1px solid var(--border-light);}
  .meta-row{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;align-items:center;}
  .meta-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);}
  .priority-wrap{position:relative;}
  .priority-btn{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:5px;border:none;}
  .priority-menu{position:absolute;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;z-index:10;min-width:120px;display:none;}
  .priority-menu.open{display:block;}
  .priority-menu button{display:block;width:100%;text-align:left;padding:7px 10px;font-size:12px;background:transparent;border:none;}

  .messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  .msg{display:flex;flex-direction:column;}
  .msg.agent{align-items:flex-end;}
  .msg.customer{align-items:flex-start;}
  .msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .msg.agent .msg-meta{flex-direction:row-reverse;}
  .msg-author{font-size:12px;font-weight:600;}
  .msg-time{font-size:10.5px;color:var(--text3);}
  .msg-bubble{max-width:70%;padding:10px 14px;border-radius:10px;font-size:13.5px;line-height:1.5;}
  .msg.customer .msg-bubble{background:var(--surface);border:1px solid var(--border);}
  .msg.agent .msg-bubble{background:var(--accent-dim);border:1px solid rgba(0,229,199,.25);}

  .reply-bar{padding:16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;}
  #replyInput{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13.5px;outline:none;resize:none;}
  #sendBtn{display:flex;align-items:center;gap:6px;background:var(--border);color:var(--text3);border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13px;height:40px;}
  #sendBtn.ready{background:var(--accent);color:#04211D;}

  .modal-overlay{position:fixed;inset:0;background:rgba(4,6,9,.7);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:480px;max-width:90vw;max-height:85vh;overflow-y:auto;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
  .modal-title{font-size:15px;font-weight:600;}
  .modal-close{background:transparent;border:none;color:var(--text3);}
  .modal-body{padding:20px;display:flex;flex-direction:column;gap:12px;}
  .form-row{display:flex;gap:12px;}
  .field{flex:1;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;color:var(--text2);font-weight:600;}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .btn-secondary{padding:9px 16px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;}
  .btn-primary{padding:9px 16px;border-radius:7px;background:var(--border);border:none;color:var(--text3);font-size:13px;font-weight:600;}
  .btn-primary.ready{background:var(--accent);color:#04211D;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS = {
  plus: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  search: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,

  mail: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>`,

  calendar: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  chevron: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  alert: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  send: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
  x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  grid: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
};

const STATUS_META = {
  open: { label: 'Open', color: 'var(--accent)' },
  pending: { label: 'In behandeling', color: 'var(--medium)' },
  resolved: { label: 'Opgelost', color: 'var(--text3)' },
};
const PRIORITY_META = {
  high: { label: 'Hoog', color: 'var(--high)', bg: 'var(--high-dim)' },
  medium: { label: 'Gemiddeld', color: 'var(--medium)', bg: 'var(--medium-dim)' },
  low: { label: 'Laag', color: 'var(--low)', bg: 'var(--low-dim)' },
};

function seedTickets(){
  const now = Date.now();
  const h = (n) => new Date(now - n*3600000).toISOString();
  return [
    { id:'TKT-2026-0847', subject:'HL-55 unit flikkert na transport', customer:'Mireille Dubois', company:'RetailVision BV', email:'m.dubois@retailvision.nl', brand:'NOVOSONIC', model:'HL-55', productType:'Holografisch display', priority:'high', status:'open', category:'Hardware', created:h(2), updated:h(1), messages:[
      {from:'customer', author:'Mireille Dubois', text:'Na levering flikkert het beeld van de HL-55 zodra we hem aanzetten. Kabel zit goed vast. Kunnen jullie meekijken voor onze opening morgen?', time:h(2)},
    ]},
    { id:'TKT-2026-0846', subject:'Content-sync loopt uit de pas tussen twee units', customer:'Tom Verhoeven', company:'Studio Noord', email:'tom@studionoord.nl', brand:'NOVOSONIC', model:'HL-40', productType:'Holografisch display', priority:'medium', status:'pending', category:'Firmware', created:h(20), updated:h(3), messages:[
      {from:'customer', author:'Tom Verhoeven', text:'Twee HL-40 schermen naast elkaar lopen na een paar uur uit sync. Firmware is bijgewerkt naar de laatste versie.', time:h(20)},
      {from:'agent', author:'Support', text:'Bedankt voor het melden. Kun je het serienummer van beide units doorgeven, dan checken we de sync-clock instellingen.', time:h(18)},
      {from:'customer', author:'Tom Verhoeven', text:'Serienummers: HL40-22913 en HL40-22914.', time:h(3)},
    ]},
    { id:'TKT-2026-0845', subject:'Vervangende bezel nodig, transportschade', customer:'Priya Patel', company:'EventCraft', email:'priya@eventcraft.eu', brand:'NOVOSONIC', model:'HL-32', productType:'Onderdeel / accessoire', priority:'low', status:'open', category:'Onderdelen', created:h(28), updated:h(27), messages:[
      {from:'customer', author:'Priya Patel', text:'De bezel van onze HL-32 is beschadigd tijdens transport. Beeld werkt prima, alleen cosmetisch defect. Kunnen we een vervangonderdeel bestellen?', time:h(28)},
    ]},
    { id:'TKT-2026-0841', subject:'Kalibratie klopt niet na firmware-update v3.2', customer:'Jasper de Wit', company:'AV Solutions NL', email:'jasper@avsolutions.nl', brand:'NOVOSONIC', model:'HL-40 / HL-55', productType:'Holografisch display', priority:'high', status:'pending', category:'Firmware', created:h(50), updated:h(6), messages:[
      {from:'customer', author:'Jasper de Wit', text:'Sinds de update naar v3.2 is de kleurkalibratie van drie units verschoven. Klant merkt het direct op.', time:h(50)},
      {from:'agent', author:'Support', text:'We hebben dit ook bij een andere klant gezien. Er komt een patch v3.2.1 deze week. Tijdelijk kun je de fabriekskalibratie herstellen via het servicemenu.', time:h(6)},
    ]},
    { id:'TKT-2026-0839', subject:'Factuur klopt niet met offerte', customer:'Linda Bosman', company:'Bosman Retail Groep', email:'linda@bosmanretail.nl', brand:'NOVOSONIC', model:'HL-40', productType:'Holografisch display', priority:'medium', status:'resolved', category:'Facturatie', created:h(96), updated:h(72), messages:[
      {from:'customer', author:'Linda Bosman', text:'De factuur voor de 4 HL-40 units wijkt af van de offerte, we zien geen staffelkorting terug.', time:h(96)},
      {from:'agent', author:'Support', text:'Onze excuses, dit was een fout bij het opstellen van de factuur. Gecorrigeerde versie is verstuurd.', time:h(72)},
    ]},
    { id:'TKT-2026-0833', subject:'Levertijd HL-70 voor beursstand', customer:'Sven Aarts', company:'ExpoWorks', email:'sven@expoworks.be', brand:'NOVOSONIC', model:'HL-70', productType:'Holografisch display', priority:'low', status:'resolved', category:'Logistiek', created:h(140), updated:h(110), messages:[
      {from:'customer', author:'Sven Aarts', text:'Wat is de huidige levertijd voor een HL-70 richting België? We hebben een beurs over drie weken.', time:h(140)},
      {from:'agent', author:'Support', text:'Voorraad is beschikbaar, levering binnen 5 werkdagen mogelijk. We plannen de zending in.', time:h(110)},
    ]},
  ];
}

let state = {
  tickets: [],
  view: 'dashboard',
  statusFilter: 'open',
  search: '',
  selectedId: null,
  showNewTicket: false,
  priorityMenuOpen: false,
};

function loadTickets(){
  try{
    const raw = localStorage.getItem('novosonic_tickets');
    if(raw){ return JSON.parse(raw); }
  }catch(e){ console.error('Kon opgeslagen tickets niet laden', e); }
  const seeded = seedTickets();
  saveTickets(seeded);
  return seeded;
}
function saveTickets(tickets){
  try{ localStorage.setItem('novosonic_tickets', JSON.stringify(tickets)); }
  catch(e){ console.error('Opslaan mislukt', e); }
}

state.tickets = loadTickets();
state.selectedId = state.tickets[0] ? state.tickets[0].id : null;

function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const hh = Math.floor(diff/3600000);
  if(hh < 1) return 'zojuist';
  if(hh < 24) return hh + 'u geleden';
  return Math.floor(hh/24) + 'd geleden';
}
function esc(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}
function dotHtml(color, pulse){
  return `<span class="dot"><span class="dot-ping ${pulse?'pulse':''}" style="background:${color}"></span><span class="dot-core" style="background:${color}"></span></span>`;
}

function setView(v){ state.view = v; render(); }
function setStatusFilter(key){ state.statusFilter = key; state.view = 'tickets'; render(); }
function openTicketFromDashboard(id){ state.view = 'tickets'; state.statusFilter = 'all'; state.selectedId = id; render(); }
function setSearch(v){ state.search = v; render(); }
function selectTicket(id){ state.selectedId = id; state.priorityMenuOpen = false; render(); }
function updateStatus(id, status){
  state.tickets = state.tickets.map(t => t.id === id ? {...t, status, updated: new Date().toISOString()} : t);
  saveTickets(state.tickets); render();
}
function togglePriorityMenu(){ state.priorityMenuOpen = !state.priorityMenuOpen; render(); }
function updatePriority(id, priority){
  state.tickets = state.tickets.map(t => t.id === id ? {...t, priority} : t);
  state.priorityMenuOpen = false;
  saveTickets(state.tickets); render();
}
function sendReply(){
  const input = document.getElementById('replyInput');
  const text = input.value.trim();
  if(!text || !state.selectedId) return;
  state.tickets = state.tickets.map(t => t.id === state.selectedId ? {
    ...t,
    status: t.status === 'open' ? 'pending' : t.status,
    updated: new Date().toISOString(),
    messages: [...t.messages, {from:'agent', author:'Support', text, time:new Date().toISOString()}]
  } : t);
  saveTickets(state.tickets);
  render();
}
function openNewTicket(){ state.showNewTicket = true; render(); }
function closeNewTicket(){ state.showNewTicket = false; render(); }
function createTicket(){
  const subject = document.getElementById('ntSubject').value.trim();
  const customer = document.getElementById('ntCustomer').value.trim();
  const company = document.getElementById('ntCompany').value.trim();
  const email = document.getElementById('ntEmail').value.trim();
  const brand = document.getElementById('ntBrand').value.trim();
  const model = document.getElementById('ntModel').value.trim();
  const productType = document.getElementById('ntProductType').value;
  const category = document.getElementById('ntCategory').value;
  const priority = document.getElementById('ntPriority').value;
  const message = document.getElementById('ntMessage').value.trim();
  if(!subject || !customer || !company || !message) return;

  const num = 848 + state.tickets.filter(t => t.id.startsWith('TKT-2026')).length;
  const id = 'TKT-2026-' + String(num).padStart(4,'0');
  const nowIso = new Date().toISOString();
  const ticket = { id, subject, customer, company, email, brand, model, productType, priority, status:'open', category, created:nowIso, updated:nowIso,
    messages:[{from:'customer', author:customer, text:message, time:nowIso}] };
  state.tickets = [ticket, ...state.tickets];
  saveTickets(state.tickets);
  state.selectedId = id;
  state.showNewTicket = false;
  render();
}

function render(){
  const counts = state.tickets.reduce((acc,t)=>{ acc[t.status]=(acc[t.status]||0)+1; return acc; }, {open:0,pending:0,resolved:0});
  const filtered = state.tickets
    .filter(t => state.statusFilter === 'all' || t.status === state.statusFilter)
    .filter(t => {
      const q = state.search.toLowerCase();
      if(!q) return true;
      return t.subject.toLowerCase().includes(q) || t.company.toLowerCase().includes(q) || t.id.toLowerCase().includes(q);
    })
    .sort((a,b)=> new Date(b.updated) - new Date(a.updated));
  const selected = state.tickets.find(t => t.id === state.selectedId);

  const navItems = [
    {key:'all', label:'Alle tickets', count: state.tickets.length},
    {key:'open', label:'Open', count: counts.open, dot: 'var(--accent)'},
    {key:'pending', label:'In behandeling', count: counts.pending, dot: 'var(--medium)'},
    {key:'resolved', label:'Opgelost', count: counts.resolved, dot: 'var(--text3)'},
  ];

  const railHtml = `
    <div class="rail">
      <div class="rail-header">
        <div class="brand">
          <div class="brand-mark">N</div>
          <div class="brand-name display">NOVOSONIC</div>
        </div>
        <div class="brand-sub">SUPPORT DESK</div>
      </div>
      <button class="new-ticket-btn" onclick="openNewTicket()">${ICONS.plus} Nieuw ticket</button>
      <div class="nav">
        <button class="nav-item ${state.view==='dashboard'?'active':''}" onclick="setView('dashboard')">
          <span class="nav-item-label">${ICONS.grid} Dashboard</span>
        </button>
      </div>
      <div class="nav" style="margin-top:10px;">
        ${navItems.map(item => `
          <button class="nav-item ${state.view==='tickets' && state.statusFilter===item.key?'active':''}" onclick="setStatusFilter('${item.key}')">
            <span class="nav-item-label">${item.dot ? dotHtml(item.dot,false) : ''} ${item.label}</span>
            <span class="nav-item-count mono">${item.count}</span>
          </button>`).join('')}
      </div>
      <div class="rail-footer">
        <div class="avatar">ST</div> Stef · LMS Distribution
      </div>
    </div>
  `;

  const listHtml = `
    <div class="list-col">
      <div class="list-search">
        <div class="search-wrap">
          ${ICONS.search}
          <input id="searchInput" placeholder="Zoek op ticket, klant of bedrijf…" value="${esc(state.search)}" oninput="setSearch(this.value)" />
        </div>
      </div>
      <div class="list-scroll">
        ${filtered.length === 0 ? '<div class="empty-note">Geen tickets gevonden.</div>' : filtered.map(t => {
          const p = PRIORITY_META[t.priority]; const s = STATUS_META[t.status];
          return `
            <button class="ticket-row ${t.id===state.selectedId?'selected':''}" onclick="selectTicket('${t.id}')">
              <div class="ticket-row-top">
                <span class="ticket-id mono">${dotHtml(s.color, t.status==='open')} ${t.id}</span>
                <span class="ticket-time mono">${timeAgo(t.updated)}</span>
              </div>
              <div class="ticket-subject">${esc(t.subject)}</div>
              <div class="ticket-row-bottom">
                <span class="ticket-company">${esc(t.company)}</span>
                <span class="badge" style="color:${p.color};background:${p.bg}">${p.label}</span>
              </div>
            </button>`;
        }).join('')}
      </div>
    </div>
  `;

  let detailHtml;
  if(!selected){
    detailHtml = `<div class="detail-col"><div class="detail-empty">Selecteer een ticket</div></div>`;
  } else {
    const p = PRIORITY_META[selected.priority];
    detailHtml = `
      <div class="detail-col">
        <div class="scanline"></div>
        <div class="detail-header">
          <div class="detail-header-top">
            <div>
              <div class="detail-id mono">${selected.id}</div>
              <div class="detail-subject display">${esc(selected.subject)}</div>
            </div>
            <div class="status-buttons">
              ${Object.entries(STATUS_META).map(([key,meta]) => `
                <button class="status-btn ${selected.status===key?'active':''}" style="color:${selected.status===key?meta.color:'var(--text3)'}" onclick="updateStatus('${selected.id}','${key}')">
                  ${dotHtml(meta.color,false)} ${meta.label}
                </button>`).join('')}
            </div>
          </div>
          <div class="meta-row">
            <div class="meta-item">${ICONS.building} ${esc(selected.company)}</div>
            <div class="meta-item">${ICONS.mail} ${esc(selected.email)}</div>
            <div class="meta-item">${ICONS.tag} ${esc(selected.category)}</div>
            ${selected.brand ? `<div class="meta-item">${ICONS.tag} ${esc(selected.brand)}${selected.model ? ' ' + esc(selected.model) : ''}</div>` : ''}
            ${selected.productType ? `<div class="meta-item">${ICONS.tag} ${esc(selected.productType)}</div>` : ''}
            <div class="meta-item">${ICONS.calendar} Geopend ${timeAgo(selected.created)}</div>
            <div class="priority-wrap">
              <button class="priority-btn" style="color:${p.color};background:${p.bg}" onclick="togglePriorityMenu()">
                ${selected.priority==='high'?ICONS.alert:''} Prioriteit: ${p.label} ${ICONS.chevron}
              </button>
              <div class="priority-menu ${state.priorityMenuOpen?'open':''}">
                ${Object.entries(PRIORITY_META).map(([key,meta]) => `<button style="color:${meta.color}" onclick="updatePriority('${selected.id}','${key}')">${meta.label}</button>`).join('')}
              </div>
            </div>
          </div>
        </div>
        <div class="messages" id="messagesScroll">
          ${selected.messages.map(m => `
            <div class="msg ${m.from}">
              <div class="msg-meta">
                <span class="msg-author" style="color:${m.from==='agent'?'var(--accent)':'var(--text)'}">${esc(m.author)}</span>
                <span class="msg-time mono">${timeAgo(m.time)}</span>
              </div>
              <div class="msg-bubble">${esc(m.text)}</div>
            </div>`).join('')}
        </div>
        <div class="reply-bar">
          <textarea id="replyInput" rows="2" placeholder="Typ een antwoord…" oninput="onReplyInput()" onkeydown="onReplyKeydown(event)"></textarea>
          <button id="sendBtn" onclick="sendReply()">${ICONS.send} Versturen</button>
        </div>
      </div>
    `;
  }

  const modalHtml = `
    <div class="modal-overlay ${state.showNewTicket?'open':''}">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title display">Nieuw ticket aanmaken</div>
          <button class="modal-close" onclick="closeNewTicket()">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          <div class="field"><label>Onderwerp</label><input id="ntSubject" placeholder="Korte omschrijving van het probleem" oninput="onModalInput()"/></div>
          <div class="form-row">
            <div class="field"><label>Naam klant</label><input id="ntCustomer" oninput="onModalInput()"/></div>
            <div class="field"><label>Bedrijf</label><input id="ntCompany" oninput="onModalInput()"/></div>
          </div>
          <div class="field"><label>E-mail</label><input id="ntEmail" type="email"/></div>
          <div class="form-row">
            <div class="field"><label>Merk</label><input id="ntBrand" placeholder="Bijv. NOVOSONIC" value="NOVOSONIC"/></div>
            <div class="field"><label>Typenummer</label><input id="ntModel" placeholder="Bijv. HL-55"/></div>
          </div>
          <div class="field"><label>Soort product</label>
            <select id="ntProductType">
              ${['Holografisch display','LED videowall','Transparant scherm','Holografische vitrine','Non touch scherm','Touch scherm','Computer','Totem','Onderdeel / accessoire','Overig'].map(c=>`<option>${c}</option>`).join('')}
            </select>
          </div>
          <div class="form-row">
            <div class="field"><label>Categorie</label>
              <select id="ntCategory">
                ${['Hardware','Firmware','Onderdelen','Logistiek','Facturatie','Overig'].map(c=>`<option>${c}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Prioriteit</label>
              <select id="ntPriority">
                <option value="low">Laag</option>
                <option value="medium" selected>Gemiddeld</option>
                <option value="high">Hoog</option>
              </select>
            </div>
          </div>
          <div class="field"><label>Beschrijving</label><textarea id="ntMessage" rows="4" oninput="onModalInput()"></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeNewTicket()">Annuleren</button>
          <button class="btn-primary" id="ntCreateBtn" onclick="createTicket()">Ticket aanmaken</button>
        </div>
      </div>
    </div>
  `;

  const priorityRank = { high: 0, medium: 1, low: 2 };
  const byStatus = (key) => state.tickets
    .filter(t => t.status === key)
    .sort((a,b) => (priorityRank[a.priority]-priorityRank[b.priority]) || (new Date(b.updated)-new Date(a.updated)));

  const highOpenCount = state.tickets.filter(t => t.status !== 'resolved' && t.priority === 'high').length;

  function kanbanCard(t){
    const p = PRIORITY_META[t.priority];
    return `
      <button class="kanban-card" onclick="openTicketFromDashboard('${t.id}')">
        <div class="kanban-card-top">
          <span class="kanban-card-id mono">${t.id}</span>
          <span class="badge" style="color:${p.color};background:${p.bg}">${p.label}</span>
        </div>
        <div class="kanban-card-subject">${esc(t.subject)}</div>
        <div class="kanban-card-bottom">
          <span class="kanban-card-company">${esc(t.company)}</span>
          <span class="ticket-time mono">${timeAgo(t.updated)}</span>
        </div>
      </button>`;
  }

  function kanbanColumn(key){
    const meta = STATUS_META[key];
    const items = byStatus(key);
    return `
      <div class="kanban-col">
        <div class="kanban-col-header">
          <span class="kanban-col-title">${dotHtml(meta.color,false)} ${meta.label}</span>
          <span class="kanban-col-count mono">${items.length}</span>
        </div>
        <div class="kanban-cards">
          ${items.length === 0 ? '<div class="kanban-empty">Geen tickets</div>' : items.map(kanbanCard).join('')}
        </div>
      </div>`;
  }

  const dashboardHtml = `
    <div class="dashboard-wrap">
      <div class="dashboard-title display">Overzicht</div>
      <div class="dashboard-sub">Status van alle tickets in één oogopslag</div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-value" style="color:var(--accent)">${counts.open}</div><div class="stat-label">${dotHtml('var(--accent)',false)} Open</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--medium)">${counts.pending}</div><div class="stat-label">${dotHtml('var(--medium)',false)} In behandeling</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--text3)">${counts.resolved}</div><div class="stat-label">${dotHtml('var(--text3)',false)} Opgelost</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--high)">${highOpenCount}</div><div class="stat-label">${ICONS.alert} Hoge prioriteit, nog niet opgelost</div></div>
      </div>
      <div class="kanban">
        ${kanbanColumn('open')}
        ${kanbanColumn('pending')}
        ${kanbanColumn('resolved')}
      </div>
    </div>
  `;

  if(state.view === 'dashboard'){
    document.getElementById('app').innerHTML = railHtml + dashboardHtml + modalHtml;
    return;
  }

  document.getElementById('app').innerHTML = railHtml + listHtml + detailHtml + modalHtml;

  const scrollEl = document.getElementById('messagesScroll');
  if(scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
}

function onReplyInput(){
  const input = document.getElementById('replyInput');
  const btn = document.getElementById('sendBtn');
  if(input.value.trim()) btn.classList.add('ready'); else btn.classList.remove('ready');
}
function onReplyKeydown(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendReply(); }
}
function onModalInput(){
  const subject = document.getElementById('ntSubject').value.trim();
  const customer = document.getElementById('ntCustomer').value.trim();
  const company = document.getElementById('ntCompany').value.trim();
  const message = document.getElementById('ntMessage').value.trim();
  const btn = document.getElementById('ntCreateBtn');
  if(subject && customer && company && message) btn.classList.add('ready'); else btn.classList.remove('ready');
}

render();
</script>
</body>
</html>
